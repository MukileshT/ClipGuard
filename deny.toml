# License and advisory check for the dependencies of ClipWarden.
#
# The command is: cargo deny check

[advisories]
# Unmaintained crates are reported, they are not rejected: the Linux GTK
# stack of Tauri brings proc-macro-error along and it is never compiled on
# Windows.
ignore = [
    "RUSTSEC-2024-0370", # proc-macro-error: unmaintained (Linux stack only)
    "RUSTSEC-2024-0429", # glib: unsound, fixed only for glib 0.20 (Linux stack only)
]
db-path = "~/.cargo/advisory-db"
yanked = "warn"

[licenses]
# Apache-2.0 is the licence of the project; everything compatible with it is
# allowed.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "CC0-1.0",
]
confidence-threshold = 0.9

[[licenses.clarify]]
# The Windows crates are generated code of Microsoft; the licence is Apache-2.0
# with an exception list.
name = "windows"
expression = "Apache-2.0 WITH LLVM-exception"
license-files = [{ path = "LICENSE", hash = 0xbd17f5a2 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
