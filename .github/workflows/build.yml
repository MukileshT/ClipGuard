name: build

on:
    push:
        branches: ["**"]
        tags: ["v*"]
    pull_request:
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

permissions:
    contents: write

jobs:
    test:
        name: test and build
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install the stable toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      . -> target
                      apps/desktop/src-tauri -> target

            - name: Check the formatting
              run: cargo fmt --all -- --check

            - name: Lint
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Test the security engine and the service
              run: cargo test --workspace

            - name: Build the background service
              run: cargo build --release -p clipwarden-daemon

            - name: Build the uninstaller
              run: cargo build --release -p clipwarden-uninstaller

            - name: Build the dashboard
              run: cargo build --release --manifest-path apps/desktop/src-tauri/Cargo.toml

            - name: Package the portable release
              shell: pwsh
              run: |
                  $portable = "dist\portable\ClipWarden"
                  New-Item -ItemType Directory -Force -Path $portable | Out-Null
                  Copy-Item "target\release\clipwarden.exe" $portable
                  Copy-Item "apps\desktop\src-tauri\target\release\clipwarden-desktop.exe" $portable
                  Copy-Item "target\release\clipwarden-uninstall.exe" (Join-Path $portable "uninstall.exe")
                  Copy-Item "LICENSE" $portable
                  Copy-Item "NOTICE" $portable
                  Compress-Archive -Path "dist\portable\ClipWarden" -DestinationPath "dist\ClipWarden-Portable.zip" -Force
                  Remove-Item -Recurse -Force "dist\portable"

            - name: Upload the portable release
              uses: actions/upload-artifact@v4
              with:
                  name: ClipWarden-Portable
                  path: dist/ClipWarden-Portable.zip
                  if-no-files-found: error

    release:
        name: publish the release
        needs: test
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Download the portable release
              uses: actions/download-artifact@v4
              with:
                  name: ClipWarden-Portable
                  path: dist

            - name: Create the release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  notes="docs/release-notes-1.0.0.md"
                  if [ -f "$notes" ]; then
                    gh release create "${GITHUB_REF_NAME}" \
                      --title "ClipWarden ${GITHUB_REF_NAME}" \
                      --notes-file "$notes" \
                      dist/ClipWarden-Portable.zip
                  else
                    gh release create "${GITHUB_REF_NAME}" \
                      --title "ClipWarden ${GITHUB_REF_NAME}" \
                      --generate-notes \
                      dist/ClipWarden-Portable.zip
                  fi
