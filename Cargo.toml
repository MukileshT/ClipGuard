[workspace]
resolver = "3"
members = [
    "crates/clipwarden-core",
    "crates/clipwarden-clipboard",
    "crates/clipwarden-daemon",
    "crates/clipwarden-uninstaller",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Mukilesh <145214507+MukileshT@users.noreply.github.com>"]
repository = "https://github.com/MukileshT/ClipWarden.git"

[workspace.dependencies]
clipwarden-core = { path = "crates/clipwarden-core", version = "1.0.0" }
clipwarden-clipboard = { path = "crates/clipwarden-clipboard", version = "1.0.0" }

regex = { version = "1.13", default-features = false, features = [
    "std",
    "unicode-case",
    "unicode-perl",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
zeroize = { version = "1.8", features = ["derive"] }
windows = "0.62"
windows-core = "0.62"
dirs = "6.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
