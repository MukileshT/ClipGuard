[package]
name = "clipwarden-daemon"
description = "ClipWarden background service: clipboard monitoring, policy enforcement and the control channel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "clipwarden_daemon"
path = "src/lib.rs"

[[bin]]
name = "clipwarden"
path = "src/main.rs"

[dependencies]
clipwarden-core.workspace = true
clipwarden-clipboard.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
clap = { version = "4", features = ["derive"] }
dirs.workspace = true
sha2.workspace = true
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = "0.10"
getrandom.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]



