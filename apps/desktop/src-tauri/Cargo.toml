[package]
name = "clipguard-desktop"
description = "ClipGuard desktop application"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Mukilesh <145214507+MukileshT@users.noreply.github.com>"]
repository = "https://github.com/MukileshT/ClipGuard.git"

# The desktop application is its own workspace so that the security engine
# can be built and tested without the web view toolchain.
[workspace]

[lib]
name = "clipguard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clipguard-core = { path = "../../../crates/clipguard-core" }
clipguard-daemon = { path = "../../../crates/clipguard-daemon" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "6.0"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["Win32_Foundation", "Win32_System_Threading"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
